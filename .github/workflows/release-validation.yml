name: Release validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "autotune/**"
      - "configs/**"
      - "docs/**"
      - "examples/**"
      - "scripts/release_smoke.py"
      - "tests/test_golden_path*.py"
      - "tests/test_pytorch_training_adapter.py"
      - "tests/test_recommendation_safety.py"
      - "tests/test_workload_runner.py"
      - "pyproject.toml"
      - ".github/workflows/release-validation.yml"
  push:
    branches:
      - main
      - "release/**"
    paths:
      - "autotune/**"
      - "configs/**"
      - "docs/**"
      - "examples/**"
      - "scripts/release_smoke.py"
      - "tests/test_golden_path*.py"
      - "tests/test_pytorch_training_adapter.py"
      - "tests/test_recommendation_safety.py"
      - "tests/test_workload_runner.py"
      - "pyproject.toml"
      - ".github/workflows/release-validation.yml"

jobs:
  installed-wheel:
    name: Installed wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - ubuntu-24.04-arm
        python-version:
          - "3.11"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate fresh installed wheel
        run: python scripts/release_smoke.py

      - name: Install source for focused tests
        run: python -m pip install -e .

      - name: Focused unit tests
        run: |
          python -m unittest tests.test_golden_path_cli tests.test_golden_path_doctor tests.test_pytorch_training_adapter tests.test_recommendation_safety tests.test_workload_runner -v

      - name: Compile package
        run: python -m compileall autotune
