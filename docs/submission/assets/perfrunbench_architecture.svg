<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #16202a; }
    .subtitle { font: 400 20px Arial, sans-serif; fill: #576574; }
    .label { font: 700 22px Arial, sans-serif; fill: #16202a; }
    .value { font: 700 22px Arial, sans-serif; fill: #16202a; }
    .annotation { font: 700 28px Arial, sans-serif; fill: #00796b; }
    .footnote { font: 400 18px Arial, sans-serif; fill: #576574; }
    .small { font: 600 16px Arial, sans-serif; fill: #16202a; }
    .matrixText { font: 700 17px Arial, sans-serif; fill: white; }
