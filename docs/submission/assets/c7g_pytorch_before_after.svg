<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
<defs>
  <style>
    .title { font: 700 34px Arial, sans-serif; fill: #16202a; }
    .subtitle { font: 400 20px Arial, sans-serif; fill: #576574; }
    .label { font: 700 22px Arial, sans-serif; fill: #16202a; }
    .value { font: 700 22px Arial, sans-serif; fill: #16202a; }
    .annotation { font: 700 28px Arial, sans-serif; fill: #00796b; }
    .footnote { font: 400 18px Arial, sans-serif; fill: #576574; }
    .small { font: 600 16px Arial, sans-serif; fill: #16202a; }
    .matrixText { font: 700 17px Arial, sans-serif; fill: white; }
    .matrixTextSmall { font: 700 14px Arial, sans-serif; fill: white; }
    .boxText { font: 600 15px Arial, sans-serif; fill: #16202a; }
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
    <path d="M0,0 L0,6 L9,3 z" fill="#1f6fb2" />
  </marker>
</defs>
<rect width="1280" height="720" fill="#f7f9fb"/>
<text x="70" y="80" class="title">PyTorch training tuning on AWS C7g</text>
<text x="70" y="118" class="subtitle">Synthetic CPU-only workload, effective batch size preserved</text>
<text x="70" y="224" class="label">Baseline</text>
<rect x="230" y="170" width="780" height="88" rx="8" fill="#d7dee8"/>
<rect x="230" y="170" width="266" height="88" rx="8" fill="#b98216"/>
<text x="514" y="224" class="value">77,859.455 samples/s</text>
<text x="70" y="384" class="label">Selected</text>
<rect x="230" y="330" width="780" height="88" rx="8" fill="#d7dee8"/>
<rect x="230" y="330" width="696" height="88" rx="8" fill="#00796b"/>
<text x="944" y="384" class="value">203,215.039 samples/s</text>
<text x="70" y="500" class="annotation">Synthetic CPU-only workload</text>
<text x="70" y="534" class="annotation">Effective batch size preserved at 128</text>
<text x="70" y="635" class="footnote">Synthetic validation of tuning and guard behavior.</text>
<text x="70" y="659" class="footnote">Not a production training-throughput claim.</text>
</svg>
