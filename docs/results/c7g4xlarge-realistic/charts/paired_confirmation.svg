<text x="731.25" y="550" text-anchor="middle" class="axis">15-CPU full capacity / c8 / interactive-short</text>
<line x1="923.75" y1="428.78" x2="923.75" y2="502.47" stroke="#dc2626" stroke-width="28"/>
