<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="624" viewBox="0 0 1100 624" role="img" aria-label="Statistical and execution guards">
<rect width="100%" height="100%" fill="#f8fafc"/>
<style>.title{font:700 30px Segoe UI,Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Segoe UI,Arial,sans-serif;fill:#64748b}.label{font:600 16px Segoe UI,Arial,sans-serif;fill:#0f172a}.value{font:700 15px Segoe UI,Arial,sans-serif;fill:#0f172a}.axis{font:700 19px Segoe UI,Arial,sans-serif;fill:#0f172a}.note{font:15px Segoe UI,Arial,sans-serif;fill:#64748b}.badge{font:700 16px Segoe UI,Arial,sans-serif;fill:#fff}</style>
<text x="70" y="58" class="title">Statistical and execution guards</text>
<text x="70" y="91" class="subtitle">Eligibility is earned from evidence; unsupported or inconclusive states remain visible.</text>
<text x="80" y="168" class="label">Measured provenance</text>
<rect x="760" y="140" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="166" text-anchor="middle" class="badge">pass</text>
<text x="80" y="226" class="label">Fresh paired evidence</text>
<rect x="760" y="198" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="224" text-anchor="middle" class="badge">pass</text>
<text x="80" y="284" class="label">Minimum samples</text>
<rect x="760" y="256" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="282" text-anchor="middle" class="badge">pass</text>
<text x="80" y="342" class="label">Outside noise band</text>
<rect x="760" y="314" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="340" text-anchor="middle" class="badge">pass</text>
<text x="80" y="400" class="label">Consistent direction</text>
<rect x="760" y="372" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="398" text-anchor="middle" class="badge">pass</text>
<text x="80" y="458" class="label">Variability threshold</text>
<rect x="760" y="430" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="456" text-anchor="middle" class="badge">pass</text>
<text x="80" y="516" class="label">Failed trials</text>
<rect x="760" y="488" width="240" height="38" rx="6" fill="#a16207"/>
<text x="880" y="514" text-anchor="middle" class="badge">warn</text>
<text x="80" y="574" class="label">Search budget</text>
<rect x="760" y="546" width="240" height="38" rx="6" fill="#15803d"/>
<text x="880" y="572" text-anchor="middle" class="badge">pass</text>
</svg>